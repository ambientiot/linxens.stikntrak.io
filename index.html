<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Linxens × Ambient IoT | Proposal</title>
  <meta name="description" content="Linxens and Ambient IoT proposal portal.">
  <style>
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#020813;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .hero{min-height:100svh;position:relative;overflow:hidden;background:#020813 url('/hero.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,6,16,.18),rgba(1,6,16,.08) 48%,rgba(1,6,16,.50));pointer-events:none}
    .logos{position:absolute;z-index:3;top:42px;left:50%;transform:translateX(-50%);width:min(980px,86vw);display:flex;align-items:center;justify-content:center;gap:56px;padding:18px 28px;border-radius:18px;background:rgba(2,8,20,.34);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
    .logos img{display:block;object-fit:contain;max-width:42%;height:86px}
    .message{position:absolute;z-index:3;left:50%;bottom:56px;transform:translateX(-50%);text-align:center;padding:16px 28px;border:1px solid rgba(255,255,255,.20);border-radius:999px;background:rgba(2,8,20,.50);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#f2c56f}
    @media(max-width:700px){.hero{background-position:68% center}.logos{top:18px;gap:20px;padding:12px 14px;width:92vw}.logos img{height:52px;max-width:46%}.message{bottom:24px;width:88vw;padding:13px 16px;font-size:10px;letter-spacing:.18em}}
  </style>
</head>
<body>
  <main class="hero" aria-label="Linxens and Ambient IoT proposal landing page">
    <div class="logos">
      <img src="/ambient-logo.png" alt="Ambient IoT">
      <img src="/linxens-logo.png" alt="Linxens">
    </div>
    <div class="message">Proposal site under construction</div>
  </main>
</body>
</html>
